# ArrheniQ application configuration (defaults; environment-specific values via env vars / secrets).
# Two database roles (docs/data/schema.md §1):
#   runtime  → arrheniq_app   (spring.datasource.*)   NO BYPASSRLS, not owner
#   flyway   → arrheniq_owner (spring.flyway.*)        owns schema objects
spring:
  application:
    name: arrheniq-app
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ARQ_DB_URL:jdbc:postgresql://localhost:5432/arrheniq}
    username: ${ARQ_DB_APP_USER:arrheniq_app}
    password: ${ARQ_DB_APP_PASSWORD:}
  flyway:
    enabled: true
    user: ${ARQ_DB_OWNER_USER:arrheniq_owner}
    password: ${ARQ_DB_OWNER_PASSWORD:}
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  session:
    # Spring Session JDBC (ADR 0006); tables created by Flyway V2, never by Spring
    jdbc:
      table-name: platform.spring_session
      initialize-schema: never
  # OIDC client registration "arrheniq" comes from the environment (cloud: Cognito; private: customer IdP),
  # e.g. SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_ARRHENIQ_CLIENT_ID; see application-local.yml for the shape.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 60m                 # fallback; set per login from tenant setting session.logoff_minutes
      cookie:
        name: ARQSESSION
        http-only: true
        secure: true
        same-site: lax

arrheniq:
  security:
    registration-id: arrheniq
    base-domain: ${ARQ_BASE_DOMAIN:}
    fixed-tenant-slug: ${ARQ_FIXED_TENANT:}
    absolute-session-lifetime: 12h
    reauth-flow-timeout: 10m
    reauth-max-age: 5m
    post-login-path: /
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
