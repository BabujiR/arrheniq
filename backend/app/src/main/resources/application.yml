# ArrheniQ application configuration (defaults; environment-specific values via env vars / secrets).
# Two database roles (docs/data/schema.md §1):
#   runtime  → arrheniq_app   (spring.datasource.*)   NO BYPASSRLS, not owner
#   flyway   → arrheniq_owner (spring.flyway.*)        owns schema objects
spring:
  application:
    name: arrheniq-app
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ARQ_DB_URL:jdbc:postgresql://localhost:5432/arrheniq}
    username: ${ARQ_DB_APP_USER:arrheniq_app}
    password: ${ARQ_DB_APP_PASSWORD:}
  flyway:
    enabled: true
    user: ${ARQ_DB_OWNER_USER:arrheniq_owner}
    password: ${ARQ_DB_OWNER_PASSWORD:}
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
