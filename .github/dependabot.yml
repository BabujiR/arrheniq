# Weekly dependency updates (security-architecture.md §6: dependencies updated weekly).
version: 2
updates:
  - package-ecosystem: maven
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns: ["org.springframework*"]
      test:
        patterns: ["org.junit*", "org.testcontainers*", "org.assertj*", "org.mockito*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
