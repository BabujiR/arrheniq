# Security checks (docs/ci/README.md, stage C3). Traces: URS-SEC-005, security-architecture.md §6.
#
# GitHub's dependency review and CodeQL code scanning are free for PUBLIC repositories only.
# Private repositories need GitHub Code Security. So:
#   - public repo  → dependency-review + CodeQL (GitHub-native)
#   - private repo → Trivy (vulnerable dependencies) + Semgrep CE (static analysis), both free
# gitleaks runs in both cases.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC: catches newly published CVEs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose --exit-code 1

  # ---------------------------------------------------------------- private repos (free tools)
  dependency-scan:
    name: Dependency vulnerabilities (Trivy)
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan of Maven dependencies (fail on HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            /repo/backend

  static-analysis:
    name: Static analysis (Semgrep CE)
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep (Java + OWASP Top 10 rules)
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest \
            semgrep scan --config p/java --config p/owasp-top-ten --metrics off --error /src/backend

  # ---------------------------------------------------------------- public repos (GitHub-native)
  dependency-review:
    name: Dependency review (PR)
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  codeql-java:
    name: CodeQL (Java)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  # ---------------------------------------------------------------- BOM security overrides (both)
  bom-pins:
    name: Spring Boot BOM security overrides
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check pins in backend/pom.xml (remove when the BOM catches up; notice when a newer fix exists)
        run: python3 scripts/ci/check_bom_pins.py backend/pom.xml | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
