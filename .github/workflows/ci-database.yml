# Database CI: applies Flyway migrations to a fresh PostgreSQL 16 with psql, then runs the schema
# linter (10 checks) and security behaviour tests (T01–T21). Fast, with no Java needed.
# Plan: docs/ci/README.md (stage C2). Traces: URS-TEN-001, URS-AUD-001/003/005, URS-SEC-001.
name: ci-database

on:
  pull_request:
    paths:
      - "backend/app/src/main/resources/db/**"
      - "backend/app/src/test/resources/db/**"
      - "scripts/ci/db-tests.sh"
      - ".github/workflows/ci-database.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/src/main/resources/db/**"
      - "backend/app/src/test/resources/db/**"
      - "scripts/ci/db-tests.sh"
      - ".github/workflows/ci-database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-tests:
    name: Migrations + RLS/audit tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 || sudo apt-get install -y -qq postgresql-client
          psql --version

      - name: Run database tests
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGSUPERUSER: postgres
          PGSUPERPASS: postgres
        run: bash scripts/ci/db-tests.sh
