# Frontend CI: type check, unit tests (Vitest), production build, dependency audit.
# Plan: docs/ci/README.md. Traces: URS-VAL-001 (test evidence), ADR 0006, ADR 0015.
name: ci-frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Type check, test, build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies (exact lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Dependency audit (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level high

      - name: Upload build (for preview / deployment slice S0.8)
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.run_number }}
          path: frontend/dist/
          retention-days: 14
          if-no-files-found: error
